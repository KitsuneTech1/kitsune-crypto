version: '3.8'

networks:
  kpl-devnet:
    driver: bridge

services:
  node-0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpl-node-0
    hostname: node-0
    command: >
      --node-id node-0
      --node-index 0
      --total-nodes 4
      --port 9200
      --peers node-1:9200,node-2:9200,node-3:9200
    ports:
      - "9201:9200"
    networks:
      - kpl-devnet
    restart: unless-stopped

  node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpl-node-1
    hostname: node-1
    command: >
      --node-id node-1
      --node-index 1
      --total-nodes 4
      --port 9200
      --peers node-0:9200,node-2:9200,node-3:9200
    ports:
      - "9202:9200"
    networks:
      - kpl-devnet
    restart: unless-stopped

  node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpl-node-2
    hostname: node-2
    command: >
      --node-id node-2
      --node-index 2
      --total-nodes 4
      --port 9200
      --peers node-0:9200,node-1:9200,node-3:9200
    ports:
      - "9203:9200"
    networks:
      - kpl-devnet
    restart: unless-stopped

  node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpl-node-3
    hostname: node-3
    command: >
      --node-id node-3
      --node-index 3
      --total-nodes 4
      --port 9200
      --peers node-0:9200,node-1:9200,node-2:9200
    ports:
      - "9204:9200"
    networks:
      - kpl-devnet
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpl-dashboard
    hostname: dashboard
    entrypoint: ["python3", "dashboard/server.py"]
    environment:
      - KPL_PORT=8792
      - KPL_CLUSTER_NODES=node-0@node-0:9200,node-1@node-1:9200,node-2@node-2:9200,node-3@node-3:9200
    ports:
      - "8792:8792"
    networks:
      - kpl-devnet
    depends_on:
      - node-0
      - node-1
      - node-2
      - node-3
    restart: unless-stopped
