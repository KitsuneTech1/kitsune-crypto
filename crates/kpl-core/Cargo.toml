[package]
name = "kpl-core"
version = "0.1.0"
edition = "2021"
authors = ["Moo <founder@kitsunetechnologies.org>"]
description = "Kitsune Private Layer - Formally verified, post-hyper-intelligence resilient cryptography core"

[dependencies]
curve25519-dalek = { version = "4", features = ["rand_core", "serde"] }
sha2 = "0.10"
subtle = "2.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
zeroize = "=1.8.1"
